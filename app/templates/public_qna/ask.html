{% extends "base.html" %}
{% block title %}Ajukan Pertanyaan — CLS{% endblock %}
{% block content %}
<div style="max-width:600px; margin:0 auto; padding:40px 16px;">
    <div style="margin-bottom:20px;">
        <a href="/qna" style="display:inline-flex; align-items:center; gap:6px; font-size:14px; color:var(--color-secondary); text-decoration:none;"
            onmouseover="this.style.color='var(--color-orange)'" onmouseout="this.style.color='var(--color-secondary)'">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            Kembali ke Forum
        </a>
    </div>
    <div class="card" style="padding:36px;">
        <h1 style="font-size:22px; font-weight:700; margin:0 0 6px;">Ajukan Pertanyaan</h1>
        <p style="font-size:14px; color:var(--color-secondary); margin:0 0 28px;">Tulis pertanyaan yang jelas agar mudah dijawab komunitas</p>

        <form method="post" action="/qna/ask" style="display:flex; flex-direction:column; gap:18px;">
            <div>
                <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px;">Judul Pertanyaan <span style="color:var(--color-red);">*</span></label>
                <div class="input-field">
                    <input type="text" name="title" required placeholder="Tulis pertanyaan yang jelas dan spesifik…" />
                </div>
            </div>
            <div>
                <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px;">Detail Pertanyaan <span style="color:var(--color-red);">*</span></label>
                <div class="input-field" style="align-items:flex-start;">
                    <textarea name="body" required rows="6" placeholder="Jelaskan konteks, apa yang sudah kamu coba, dan di mana kamu bingung…"
                        style="resize:none; min-height:140px;"></textarea>
                </div>
            </div>
            <div>
                <label style="font-size:13px; font-weight:600; display:block; margin-bottom:6px;">Tag Topik</label>
                <div class="input-field">
                    <svg width="16" height="16" fill="none" stroke="var(--color-secondary)" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
                    </svg>
                    <input type="text" name="topic_tag" placeholder="Contoh: Python, Rekursi, OOP, Algoritma" />
                </div>
            </div>
            <!-- Anon toggle -->
            <label style="display:flex; align-items:center; gap:12px; padding:14px 16px;
                background:var(--color-soft); border-radius:var(--radius-lg); cursor:pointer;
                border:1.5px solid var(--color-border);">
                <input type="checkbox" name="is_anonymous" value="true"
                    style="width:18px; height:18px; accent-color:var(--color-orange); cursor:pointer;" />
                <div>
                    <p style="font-size:14px; font-weight:600; margin:0 0 2px;">Posting anonim</p>
                    <p style="font-size:12px; color:var(--color-secondary); margin:0;">Kamu akan tampil sebagai "{{ session_user.anonymous_alias }}"</p>
                </div>
            </label>
            <div style="display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary btn-md" style="flex:1; justify-content:center;">
                    Kirim Pertanyaan
                    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <a href="/qna" class="btn btn-ghost btn-md" style="border:1.5px solid var(--color-border);">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
